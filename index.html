<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 外部リソースを一切読み込まない前提のポリシー。万一スクリプトが混入しても
     外部への送信・外部からの読み込みを遮断する。CSS/JSは全て同一ファイル内の
     インラインのため 'unsafe-inline' が必要。
     frame-ancestors は meta では無効（HTTPヘッダ専用）だが、
     GitHub Pages ではヘッダを付けられないため省略している。 -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'self';
  manifest-src 'self';
  worker-src 'self';
  media-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151a2b" id="metaTheme">
<title>ナディーショーダナ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* =========================================================
   カラー方針（2テーマ共通ルール）
   ・アクション色（ティール系） = 操作できる / 今アクティブ
   ・ストリーク色（オレンジ系）  = 継続記録
   ・呼吸フェーズ色            = 吸う(ティール) / 止める(バイオレット) / 吐く(オレンジ)
   ・それ以外はすべてニュートラル階調
   ライトテーマはダークと同じ色相を保ったまま、白地で読めるよう
   明度を下げ彩度を上げた対応色に差し替える（淡い色は白地で沈むため）。
   ========================================================= */
:root{
  --page:#0d1120;
  --surface:#151a2b;
  --text:#e9ecf4;
  --muted:#8b94aa;
  --dim:#7b85a0;      /* #151a2b 上で 4.70:1。小さい説明文(10.5px)の可読性を確保 */
  --card:#232b42;
  --line:rgba(255,255,255,.07);
  --soft:rgba(255,255,255,.06);
  --soft2:rgba(255,255,255,.05);
  --softbd:rgba(255,255,255,.12);
  --sheet:#1b2238;
  --input:#111728;
  --inputbd:#333d5c;
  --btn2:#242c45;
  --radio:#5a6490;
  --swoff:#434d68;              /* 仕様書 §6：OFFトグルの暗所視認性 */
  --swoffbd:#717c98;

  /* 仕様書 v1.0 §1.2：アンバー(継続記録)とオレンジ(吐く)は別色。
     同一色にすると「アンバー＝継続記録専用」の意味が呼吸ビジュアルと混ざる。 */
  --action:#45dfb1;  --on-action:#06301f;  --action-soft:rgba(69,223,177,.15);
  --streak:#f0a73a;  --streak-bg:rgba(240,167,58,.14);
  --c-in:#45dfb1;    --on-in:#06301f;
  --c-hold:#a78bfa;  --on-hold:#2a1a4a;
  --c-ex:#f0a365;    --on-ex:#4a2a05;
  --sel-bg:#1b3a35;

  --tube-bg:#171d2e;
  --tube-fut:#141a2a;
  --tube-bd:#333d5c;
  --tube-bd-fut:#262e46;
  --tube-bd-act:#4a5679;
  --tick:#414b6b;
  --dot:#262e47;
  --neutral:#737e97;
  --nose:#4e5775;
  --ovl:rgba(14,18,31,.9);
  --shadow:rgba(0,0,0,.4);

  --fs:1;
  --bar:36px;
}
:root[data-theme="light"]{
  --page:#dfe3ec;
  --surface:#ffffff;
  --text:#1b2130;
  --muted:#5c6679;
  --dim:#6b7586;      /* 白地で 4.65:1。小さい説明文(10.5px)に使うため AA を満たす値にする */
  --card:#f2f4f8;
  --line:rgba(0,0,0,.09);
  --soft:rgba(0,0,0,.045);
  --soft2:rgba(0,0,0,.035);
  --softbd:rgba(0,0,0,.12);
  --sheet:#ffffff;
  --input:#f4f6fa;
  --inputbd:#c7cedb;
  --btn2:#eceff5;
  --radio:#aeb6c6;
  --swoff:#c2c9d6;
  --swoffbd:rgba(0,0,0,.14);

  /* 白地で白文字を載せても、白地に文字として置いても AA(4.5:1) を満たす深さまで
     明度を落としている。色相はダークと同じ（緑＝吸う/操作、紫＝止める、橙＝吐く/記録）。 */
  --action:#087d5c;  --on-action:#ffffff;  --action-soft:rgba(8,125,92,.13);
  --streak:#8a6212;  --streak-bg:rgba(138,98,18,.12);   /* アンバー系（黄寄り） */
  --c-in:#087d5c;    --on-in:#ffffff;
  --c-hold:#6f4fe0;  --on-hold:#ffffff;
  --c-ex:#ad5f18;    --on-ex:#ffffff;                   /* オレンジ系（赤寄り）。上と別色 */
  --sel-bg:#e3f2ec;

  --tube-bg:#e6e9f0;
  --tube-fut:#eef0f5;
  --tube-bd:#ccd2de;
  --tube-bd-fut:#dfe3eb;
  --tube-bd-act:#aeb7c7;
  --tick:#a8b1c2;
  --dot:#dde1ea;
  --neutral:#9aa3b4;
  --nose:#98a1b2;
  --ovl:rgba(255,255,255,.93);
  --shadow:rgba(0,0,0,.18);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--page);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#app{
  width:100%;max-width:430px;height:100%;max-height:900px;background:var(--surface);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:460px) and (min-height:920px){ #app{border-radius:28px;height:860px;} }

.screen{
  position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
}
.screen.on{display:flex;}

.hdr{display:flex;align-items:center;justify-content:space-between;flex:none;min-height:28px;}
.hdr .ttl{font-size:calc(14px * var(--fs));font-weight:700;}
.icobtn{font-size:calc(18px * var(--fs));color:var(--muted);background:none;border:0;padding:4px 6px;cursor:pointer;font-family:inherit;}
.hdr-note{font-size:calc(11px * var(--fs));color:var(--dim);margin-top:10px;text-align:center;flex:none;}

/* ---------- HOME ---------- */
.logo{font-size:calc(19px * var(--fs));font-weight:700;text-align:center;margin-top:26px;flex:none;}
.logo-sub{font-size:calc(11.5px * var(--fs));color:var(--dim);text-align:center;margin-top:5px;flex:none;}
.start{
  margin:auto auto 0;width:150px;height:150px;border-radius:50%;border:0;cursor:pointer;
  background:var(--action);color:var(--on-action);
  font-size:calc(22px * var(--fs));font-weight:700;font-family:inherit;
  box-shadow:0 0 0 9px var(--action-soft);flex:none;
}
.start:active{transform:scale(.97);}
.cur-card{
  margin:auto 0 0;width:100%;background:var(--soft);border-radius:14px;
  padding:13px 15px;border:0;cursor:pointer;font-family:inherit;text-align:left;color:inherit;flex:none;
}
.cur-card .r1{display:flex;justify-content:space-between;align-items:center;}
.cur-card .nm{font-size:calc(15px * var(--fs));font-weight:700;}
.cur-card .mt{font-size:calc(11.5px * var(--fs));color:var(--muted);margin-top:6px;}
.cv{color:var(--muted);font-size:calc(17px * var(--fs));}
.streak-wrap{text-align:center;margin-top:18px;flex:none;}
.streak{
  display:inline-flex;align-items:center;gap:6px;background:var(--streak-bg);
  color:var(--streak);padding:7px 15px;border-radius:20px;font-size:calc(12.5px * var(--fs));font-weight:700;
}

/* ---------- ratio bar ---------- */
.ratio{display:flex;gap:2px;margin-top:9px;height:calc(15px * var(--fs));border-radius:4px;overflow:hidden;}
.ratio>div{display:flex;align-items:center;justify-content:center;font-size:calc(8.5px * var(--fs));font-weight:700;}
.r-in{background:var(--c-in);color:var(--on-in);}
.r-ho{background:var(--c-hold);color:var(--on-hold);}
.r-ex{background:var(--c-ex);color:var(--on-ex);}

/* ---------- lists / presets ---------- */
.list{flex:1;overflow-y:auto;margin-top:12px;-webkit-overflow-scrolling:touch;}
.pcard{
  width:100%;background:var(--card);border-radius:14px;padding:13px 15px;margin-bottom:11px;
  border:2px solid transparent;cursor:pointer;font-family:inherit;color:inherit;text-align:left;display:block;
}
.pcard.sel{border-color:var(--action);background:var(--sel-bg);}
.pcard .r1{display:flex;justify-content:space-between;align-items:center;}
.rn{display:flex;align-items:center;gap:9px;}
.radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--radio);position:relative;flex:none;}
.pcard.sel .radio{border-color:var(--action);}
.pcard.sel .radio::after{content:"";position:absolute;top:2.5px;left:2.5px;width:7px;height:7px;border-radius:50%;background:var(--action);}
.pnm{font-size:calc(15px * var(--fs));font-weight:700;}
.ind{margin-left:25px;}
.pmt{font-size:calc(11.5px * var(--fs));color:var(--muted);margin-top:6px;}
.chip-lb{font-size:calc(9.5px * var(--fs));color:var(--dim);margin-top:13px;letter-spacing:.04em;}
.chips{display:flex;gap:6px;margin-top:6px;}
.chip{
  flex:1;padding:7px 2px;border-radius:8px;text-align:center;font-size:calc(11.5px * var(--fs));font-weight:700;
  background:var(--soft);color:var(--muted);border:1px solid var(--softbd);
  cursor:pointer;font-family:inherit;white-space:nowrap;overflow:hidden;
}
.chip.on{background:var(--action);color:var(--on-action);border-color:var(--action);}
.chip.sm{font-size:calc(10.5px * var(--fs));}

/* ---------- rows ---------- */
.row{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;
  color:inherit;font-family:inherit;text-align:left;cursor:pointer;
}
.row:last-child{border-bottom:0;}
.rnm{font-size:calc(13.5px * var(--fs));font-weight:600;}
.rds{font-size:calc(10.5px * var(--fs));color:var(--dim);margin-top:3px;line-height:1.5;}
.sub{padding-left:15px;border-left:2px solid var(--softbd);}
.upd-st{font-size:calc(11px * var(--fs));color:var(--muted);flex:none;text-align:right;max-width:46%;}
.upd-st.go{color:var(--action);font-weight:700;}
.sw{width:44px;height:24px;border-radius:13px;position:relative;flex:none;transition:background .18s;}
.sw.on{background:var(--action);}
.sw.off{background:var(--swoff);border:1.5px solid var(--swoffbd);}
.kb{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px var(--shadow);transition:left .18s,right .18s;}
.sw.on .kb{right:2px;} .sw.off .kb{left:1px;}

/* ---------- 準備時間ピッカー（仕様書 §3） ---------- */
.pick-wrap{margin-top:20px;flex:none;}
.pick-lb{font-size:calc(10px * var(--fs));color:var(--dim);text-align:center;letter-spacing:.04em;}
.pick-rail{position:relative;height:34px;margin-top:7px;}
.pick-pill{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:62px;height:34px;border-radius:9px;background:var(--soft);border:1px solid var(--softbd);
}
.pick-scroll{
  position:absolute;inset:0;display:flex;align-items:center;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.pick-scroll::-webkit-scrollbar{display:none;}
.pick-item{
  flex:none;width:62px;text-align:center;scroll-snap-align:center;
  font-size:calc(13px * var(--fs));font-weight:700;color:var(--muted);
  transition:color .15s;
}
.pick-item.on{color:var(--text);}
.pick-fade{position:absolute;top:0;bottom:0;width:46px;pointer-events:none;}
.pick-fade.l{left:0;background:linear-gradient(to right,var(--surface),transparent);}
.pick-fade.r{right:0;background:linear-gradient(to left,var(--surface),transparent);}
.pick-note{
  font-size:calc(10px * var(--fs));color:var(--streak);text-align:center;
  margin-top:8px;line-height:1.6;display:none;
}
.pick-note.on{display:block;}
.pick-note u{cursor:pointer;}

/* 準備シーケンスの中央カウント（∩ の開口部） */
.prep-num{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-38%);
  text-align:center;font-size:calc(56px * var(--fs));font-weight:300;color:var(--text);
  line-height:1;
}

/* ---------- 表示設定 ---------- */
.grp{margin-bottom:22px;}
.grp-lb{font-size:calc(11px * var(--fs));font-weight:700;color:var(--muted);margin-bottom:8px;}
.grp .chips{margin-top:0;}

/* ---------- SESSION ---------- */
#session{padding-left:16px;padding-right:16px;}
.s-head{font-size:calc(10.5px * var(--fs));color:var(--dim);text-align:center;letter-spacing:.04em;flex:none;}
.rigwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
/* 仕様書 §8.1：rig 180×200、3本とも同じ太さ、角丸は厚みの約20%、上辺と縦バーの間隙12px */
.rig{position:relative;width:180px;height:200px;}
.tube{position:absolute;background:var(--tube-bg);border:1.5px solid var(--tube-bd);border-radius:8px;}
.tube.h{top:0;left:0;right:0;height:var(--bar);}
.tube.v{top:calc(var(--bar) + 12px);bottom:0;width:var(--bar);}
.tube.v.l{left:0;} .tube.v.r{right:0;}
.tube.fut{border-color:var(--tube-bd-fut);background:var(--tube-fut);}
.tube.act{border-color:var(--tube-bd-act);}
.fill{position:absolute;border-radius:4px;z-index:1;}
.tk{position:absolute;}
.tk-bg{background:var(--tick);z-index:0;}
.tk-fg{background:var(--tube-bg);z-index:2;}
.nose{position:absolute;bottom:-17px;font-size:calc(9px * var(--fs));color:var(--nose);letter-spacing:.06em;width:var(--bar);text-align:center;}
.nose.l{left:0;} .nose.r{right:0;}
.plab{text-align:center;font-size:calc(16px * var(--fs));font-weight:700;flex:none;margin-top:14px;}
.pnum{text-align:center;flex:none;margin-top:4px;color:var(--muted);}
.pnum b{font-size:calc(28px * var(--fs));font-weight:700;color:var(--text);}
.pnum i{font-size:calc(11.5px * var(--fs));color:var(--dim);margin-left:3px;font-style:normal;}
.dots{display:flex;align-items:center;justify-content:center;gap:5px;flex:none;margin-top:auto;padding-top:16px;flex-wrap:wrap;}
.dot{height:6px;border-radius:3px;background:var(--dot);}
.dot.dn{background:var(--neutral);} .dot.cur{background:var(--action);}
/* ラウンド13以上のときの連続バー表示 */
.rbar{width:180px;height:6px;border-radius:3px;background:var(--dot);overflow:hidden;}
.rbar-fill{height:100%;background:var(--neutral);border-radius:3px;transition:width .3s;}
.rbar-tx{width:100%;text-align:center;font-size:calc(10px * var(--fs));color:var(--dim);margin-top:7px;}
.taphint{text-align:center;font-size:calc(10px * var(--fs));color:var(--dim);margin-top:12px;flex:none;}

.ovl{
  position:absolute;inset:0;background:var(--ovl);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 32px;z-index:5;
}
.ovl h3{font-size:calc(17px * var(--fs));font-weight:700;}
.ovl p{font-size:calc(11.5px * var(--fs));color:var(--dim);margin-top:8px;text-align:center;}

.btn{
  border-radius:12px;padding:14px 0;text-align:center;font-size:calc(13.5px * var(--fs));font-weight:700;width:100%;
  border:0;cursor:pointer;font-family:inherit;
}
.btn.p{background:var(--action);color:var(--on-action);}
.btn.s{background:var(--btn2);color:var(--text);}
.btn+.btn{margin-top:10px;}
.btns{margin-top:auto;width:100%;flex:none;}

/* ---------- DONE ---------- */
.chk{
  margin:34px auto 0;width:78px;height:78px;border-radius:50%;
  background:var(--action-soft);
  display:flex;align-items:center;justify-content:center;font-size:calc(38px * var(--fs));color:var(--action);position:relative;flex:none;
}
.flame{
  position:absolute;bottom:-4px;right:-7px;width:26px;height:26px;border-radius:50%;
  background:var(--surface);display:flex;align-items:center;justify-content:center;border:2px solid var(--page);
}
.dttl{margin-top:16px;font-size:calc(19px * var(--fs));font-weight:700;text-align:center;flex:none;}
.stats{width:100%;margin-top:20px;display:flex;flex-direction:column;gap:9px;flex:none;}
.st{display:flex;justify-content:space-between;font-size:calc(12.5px * var(--fs));background:var(--soft2);padding:11px 13px;border-radius:10px;}
.st .k{color:var(--muted);}
.st .v{font-weight:700;}

/* ---------- sheet / inputs ---------- */
.sheet{position:absolute;inset:0;background:rgba(10,13,24,.72);display:flex;align-items:flex-end;z-index:9;}
.sheet-in{width:100%;background:var(--sheet);border-radius:18px 18px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);}
.sheet h4{font-size:calc(14px * var(--fs));font-weight:700;}
.sheet .hint{font-size:calc(11px * var(--fs));color:var(--dim);margin-top:6px;}
.num{
  width:100%;margin-top:14px;background:var(--input);border:1px solid var(--inputbd);border-radius:10px;
  color:var(--text);font-size:calc(19px * var(--fs));font-weight:700;text-align:center;padding:12px 0;font-family:inherit;
}
.num:focus{outline:none;border-color:var(--action);}
.frow{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);}
.frow label{font-size:calc(13px * var(--fs));font-weight:600;}
.frow input{
  width:84px;background:var(--input);border:1px solid var(--inputbd);border-radius:9px;color:var(--text);
  font-size:calc(15px * var(--fs));font-weight:700;text-align:center;padding:9px 0;font-family:inherit;
}
.frow input:focus{outline:none;border-color:var(--action);}
.empty{font-size:calc(12px * var(--fs));color:var(--dim);text-align:center;margin-top:40px;}
.hitem{background:var(--soft2);border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:calc(12px * var(--fs));}
.hitem .d{color:var(--muted);font-size:calc(10.5px * var(--fs));margin-top:3px;}
.about{font-size:calc(12.5px * var(--fs));color:var(--muted);line-height:1.9;margin-top:16px;}

/* ---------- onboarding ---------- */
.ob-ttl{font-size:calc(20px * var(--fs));font-weight:700;text-align:center;margin-top:20px;flex:none;}
.ob-sub{font-size:calc(11.5px * var(--fs));color:var(--dim);text-align:center;margin-top:7px;flex:none;}
.extnote{font-size:calc(10px * var(--fs));color:var(--dim);text-align:center;margin-top:10px;line-height:1.6;}
a.btn{display:block;text-decoration:none;}
.ob-steps{display:flex;gap:7px;justify-content:center;margin-top:16px;flex:none;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--dot);}
.sdot.on{background:var(--action);}
</style>
</head>
<body>
<div id="app">

  <!-- ===== ONBOARDING（1:表示 / 2:通知） ===== -->
  <section class="screen" id="onboard">
    <div class="ob-ttl" id="obTtl"></div>
    <div class="ob-sub" id="obSub"></div>
    <div class="ob-steps"><span class="sdot" id="sd1"></span><span class="sdot" id="sd2"></span></div>

    <div class="list" id="obStep1">
      <div class="grp"><div class="grp-lb" data-i="disp.lang"></div><div class="chips" id="obLang"></div></div>
      <div class="grp"><div class="grp-lb" data-i="disp.theme"></div><div class="chips" id="obTheme"></div></div>
      <div class="grp"><div class="grp-lb" data-i="disp.fs"></div><div class="chips" id="obFs"></div></div>
      <div class="grp"><div class="grp-lb" data-i="disp.bar"></div><div class="chips" id="obBar"></div></div>
    </div>

    <div class="list" id="obStep2" style="display:none">
      <div class="row" data-tg="sound">
        <div><div class="rnm" data-i="nt.sound"></div><div class="rds" data-i="nt.soundD"></div></div>
        <div class="sw"><div class="kb"></div></div>
      </div>
      <div class="row" data-tg="breath">
        <div><div class="rnm" data-i="nt.breath"></div><div class="rds" data-i="nt.breathD"></div></div>
        <div class="sw"><div class="kb"></div></div>
      </div>

 'sheet.rounds':'Rounds','sheet.roundsHint':'Choose a number between 3 and 20','sheet.ok':'OK','sheet.cancel':'Cancel',
 'about.body':'A guide app for Nadi Shodhana (alternate nostril breathing).<br><br>One round has six phases: inhale left → hold → exhale right → inhale right → hold → exhale left.<br><br>The vertical bars are anchored at the top and change in height: shrinking means inhaling, growing means exhaling. While you hold, the top bar empties from the side the breath came in.<br><br>All records stay on your device.'
}};
function t(k){ return (T[S.lang]&&T[S.lang][k]) || T.ja[k] || k; }

const FLAME='<svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 2C9 6 6 8.5 6 13a6 6 0 0 0 12 0c0-2.3-1-4.2-2.3-5.8-.4 1.3-1.1 2.1-1.9 2.1-1 0-1.6-.8-1.4-2C12.6 5.6 12.3 3.8 12 2z" fill="currentColor"/></svg>';

/* 公開するたびに上げる。設定の「システムを更新」が
   サーバー上の index.html からこの値を読み出して比較する。 */
const APP_VERSION='1.7.1';

/* =========================================================
   定数
   ========================================================= */
/* 仕様書 v1.0 §4。既定ラウンド数は固定値ではなく初期値。 */
const PRESETS=[
  {id:'4-8-8',   inhale:4, hold:8,  exhale:8,  def:4},  /* 40s/R × 4 = 2分40秒 */
  {id:'6-12-12', inhale:6, hold:12, exhale:12, def:3},  /* 60s/R × 3 = 3分00秒 */
  {id:'4-16-8',  inhale:4, hold:16, exhale:8,  def:3},  /* 56s/R × 3 = 2分48秒 */
];
const CHIPS=[2,4,6,10];
/* 1ラウンド＝左右1往復なので奇数でも左右非対称にならない（偶数制約は不要） */
const MIN_R=1, MAX_R=20;
/* 準備時間（姿勢ステップ）の選択肢。0＝なし */
const PREPS=[0,3,5,10,15,20,30,60];
/* 導入呼吸は固定（仕様書 §7.1）。吸う:吐く＝1:2 */
const PREP_IN=3, PREP_EX=6, PREP_GAP=1;
/* 目盛りは「秒数＝分割数」。本数で上限を切ると 4-16-8 の止める16秒のような
   標準プリセットまで消えるため、1マスの実寸(px)で判定する。 */
const MIN_TICK_PX=8;
const FS={s:.88,m:1,l:1.18};
/* 「普通」が仕様書 §8.1 の規定値 32px。細い/太いは表示設定での利用者選択 */
const BARW={s:'26px',m:'32px',l:'42px'};

function phasesOf(p){
  return [
    {k:'inhale', dur:p.inhale, lab:'ph.inL', col:'in',   bar:'left',  vo:'vo.inL'},
    {k:'hold',   dur:p.hold,   lab:'ph.hold',col:'hold', bar:'top', dir:'ltr', vo:'vo.hold'},
    {k:'exhale', dur:p.exhale, lab:'ph.exR', col:'ex',   bar:'right', vo:'vo.exR'},
    {k:'inhale', dur:p.inhale, lab:'ph.inR', col:'in',   bar:'right', vo:'vo.inR'},
    {k:'hold',   dur:p.hold,   lab:'ph.hold',col:'hold', bar:'top', dir:'rtl', vo:'vo.hold'},
    {k:'exhale', dur:p.exhale, lab:'ph.exL', col:'ex',   bar:'left',  vo:'vo.exL'},
  ];
}
const BARS=[
  {top:['fut'],       left:['act'],       right:['fut']},
  {top:['act'],       left:['done','in'], right:['fut']},
  {top:['done','hold'],left:['done','in'],right:['act']},
  {top:['fut'],       left:['fut'],       right:['act']},
  {top:['act'],       left:['fut'],       right:['done','in']},
  {top:['done','hold'],left:['act'],      right:['done','in']},
];
const CVAR={in:'var(--c-in)',hold:'var(--c-hold)',ex:'var(--c-ex)'};

/* =========================================================
   保存データ
   ========================================================= */
const DEF_STATE={
  onboarded:false,
  lang:'ja', theme:'dark', fs:'m', bar:'m',
  presetId:'4-8-8',
  rounds:{'4-8-8':4,'6-12-12':3,'4-16-8':3,'custom':4},
  prepSeconds:5,
  custom:{inhale:4,hold:8,exhale:8},
  settings:{sound:true,breath:true,tick:false,vibe:true,voice:true,wake:true,bg:true,bgm:false},
  voiceKind:'warm',
  streak:{count:0,last:null},
  history:[],
};
let S;
const clone=o=>JSON.parse(JSON.stringify(o));

/* innerHTML に文字列を載せる場合は必ずこれを通す。
   現状 preset 名は固定文字列だが、保存データは書き換え可能なため
   「描画側で必ずエスケープする」方を不変条件にしておく。 */
function esc(v){
  return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 保存データは信頼しない。既知のキーだけを型と範囲を検証して取り込み、
   想定外のキーは一切引き継がない（丸ごと Object.assign しない）。
   壊れた値や改変された値があっても既定値に落ちるだけで動作が壊れないようにする。 */
function load(){
  S=clone(DEF_STATE);
  let raw=null;
  try{ raw=localStorage.getItem('nadi'); }catch(e){ return; }
  if(!raw) return;

  let o;
  try{ o=JSON.parse(raw); }catch(e){ return; }
  if(!o || typeof o!=='object' || Array.isArray(o)) return;

  const num=(v,a,b,d)=>{ v=Number(v); return Number.isFinite(v) ? Math.min(b,Math.max(a,Math.round(v))) : d; };
  const pick1=(v,allowed,d)=>allowed.includes(v)?v:d;

  S.onboarded = o.onboarded===true;
  S.lang  = pick1(o.lang, Object.keys(T), DEF_STATE.lang);
  S.theme = pick1(o.theme,['dark','light'], DEF_STATE.theme);
  S.fs    = pick1(o.fs,   Object.keys(FS), DEF_STATE.fs);
  S.bar   = pick1(o.bar,  Object.keys(BARW), DEF_STATE.bar);

  const ids=[...PRESETS.map(p=>p.id),'custom'];
  S.presetId = pick1(o.presetId, ids, DEF_STATE.presetId);
  S.prepSeconds = PREPS.includes(Number(o.prepSeconds)) ? Number(o.prepSeconds) : DEF_STATE.prepSeconds;
  S.voiceKind = pick1(o.voiceKind, VOICE_KINDS, DEF_STATE.voiceKind);

  if(o.rounds && typeof o.rounds==='object'){
    ids.forEach(id=>{ if(id in o.rounds) S.rounds[id]=num(o.rounds[id],MIN_R,MAX_R,DEF_STATE.rounds[id]); });
  }
  if(o.custom && typeof o.custom==='object'){
    S.custom={
      inhale:num(o.custom.inhale,1,30,DEF_STATE.custom.inhale),
      hold:  num(o.custom.hold,  0,40,DEF_STATE.custom.hold),
      exhale:num(o.custom.exhale,1,40,DEF_STATE.custom.exhale),
    };
  }
  if(o.settings && typeof o.settings==='object'){
    Object.keys(DEF_STATE.settings).forEach(k=>{
      if(k in o.settings) S.settings[k]=o.settings[k]===true;
    });
  }
  if(o.streak && typeof o.streak==='object'){
    S.streak={
      count:num(o.streak.count,0,100000,0),
      last:(typeof o.streak.last==='string' && /^\d{4}-\d{2}-\d{2}$/.test(o.streak.last)) ? o.streak.last : null,
    };
  }
  if(Array.isArray(o.history)){
    S.history=o.history.slice(-200).filter(h=>h&&typeof h==='object').map(h=>({
      preset:String(h.preset==null?'':h.preset).slice(0,40),
      rounds:num(h.rounds,0,100000,0),
      sec:   num(h.sec,0,100000000,0),
      date:  (typeof h.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(h.date))?h.date:'',
      time:  (typeof h.time==='string'&&/^\d{2}:\d{2}$/.test(h.time))?h.time:'',
    }));
  }
}
function save(){ try{ localStorage.setItem('nadi',JSON.stringify(S)); }catch(e){} }

/* =========================================================
   表示設定の適用
   ========================================================= */
function applyDisplay(){
  const r=document.documentElement;
  r.dataset.theme=S.theme;
  r.lang=S.lang;
  r.style.setProperty('--fs',FS[S.fs]);
  r.style.setProperty('--bar',BARW[S.bar]);
  const m=document.getElementById('metaTheme');
  if(m) m.content = S.theme==='light' ? '#ffffff' : '#151a2b';
  document.title=t('app.name');
}
function applyLang(){
  document.querySelectorAll('[data-i]').forEach(n=>{ n.textContent=t(n.dataset.i); });
  document.getElementById('aboutBody').innerHTML=t('about.body');
  document.getElementById('supportBody').innerHTML=t('support.body');
  document.getElementById('noseL').textContent=t('nose.l');
  document.getElementById('noseR').textContent=t('nose.r');
}

/* =========================================================
   ユーティリティ
   ========================================================= */
function presetById(id){
  if(id==='custom') return Object.assign({id:'custom',def:8},S.custom);
  return PRESETS.find(p=>p.id===id)||PRESETS[0];
}
function roundSec(p){ return (p.inhale+p.hold+p.exhale)*2; }
function roundsFor(id){ const r=S.rounds[id]; return clamp(r==null?presetById(id).def:r,MIN_R,MAX_R); }
function clamp(v,a,b){ v=Math.round(Number(v)||0); return v<a?a:(v>b?b:v); }
function fmt(sec){
  sec=Math.round(sec);
  const m=Math.floor(sec/60), s=sec%60;
  if(S.lang==='en'){
    if(m===0) return s+' sec';
    return s===0 ? m+' min' : m+' min '+s+' sec';
  }
  if(m===0) return s+'秒';
  return s===0 ? m+'分' : m+'分'+s+'秒';
}
/* 「8ラウンド · 約5分20秒」/「8 rounds · about 5 min 20 sec」 */
function metaLine(p,r){
  return S.lang==='en'
    ? r+' '+t('u.rounds')+' · '+t('u.about')+' '+fmt(roundSec(p)*r)
    : r+t('u.rounds')+' · '+t('u.about')+fmt(roundSec(p)*r);
}
function streakText(n){
  return S.lang==='en' ? n+'-'+t('u.streak') : n+t('u.streak');
}
function ratioHTML(p){
  const tot=p.inhale+p.hold+p.exhale;
  const w=v=>(v/tot*100).toFixed(1)+'%';
  const L=S.lang==='en'?['IN','HOLD','OUT']:['吸','止','吐'];
  return '<div class="r-in" style="width:'+w(p.inhale)+'">'+L[0]+'</div>'
       + '<div class="r-ho" style="width:'+w(p.hold)+'">'+L[1]+'</div>'
       + '<div class="r-ex" style="width:'+w(p.exhale)+'">'+L[2]+'</div>';
}
function label(id){ return id==='custom'?t('u.custom'):id; }

/* =========================================================
   画面遷移
   ========================================================= */
let cur='home';
function go(id){
  if(cur==='session'&&id!=='session') stopSession();
  if(cur==='prep'&&id!=='prep') stopPrep();
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  cur=id;
  if(id==='home') renderHome();
  if(id==='presets') renderPresets();
  if(id==='custom') renderCustom();
  if(id==='display') renderDisplay();
  if(id==='hub') renderUpdateRow();
  if(id==='notif') renderToggles();
  if(id==='history') renderHistory();
  if(id==='onboard') renderOnboard();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const x=e.target.closest('[data-tg]'); if(x){ toggle(x.dataset.tg); }
});

/* =========================================================
   セグメント選択UI（言語・テーマ・文字サイズ・バー太さ 共通）
   ========================================================= */
function segs(box,opts,curVal,onPick){
  box.innerHTML=opts.map(o=>
    '<button class="chip'+(o.v===curVal?' on':'')+'" data-v="'+o.v+'">'+o.l+'</button>').join('');
  box.onclick=e=>{ const b=e.target.closest('[data-v]'); if(b) onPick(b.dataset.v); };
}
const OPT={
  lang:()=>[{v:'ja',l:'日本語'},{v:'en',l:'English'}],
  theme:()=>[{v:'dark',l:t('th.dark')},{v:'light',l:t('th.light')}],
  fs:()=>[{v:'s',l:t('fs.s')},{v:'m',l:t('fs.m')},{v:'l',l:t('fs.l')}],
  bar:()=>[{v:'s',l:t('bar.s')},{v:'m',l:t('bar.m')},{v:'l',l:t('bar.l')}],
};
function pick(key,val,rerender){
  S[key]=val; save(); applyDisplay();
  if(key==='lang') applyLang();
  rerender();
}

/* ---------- 表示設定画面 ---------- */
function renderDisplay(){
  segs(dpLang, OPT.lang(),  S.lang, v=>pick('lang',v,renderDisplay));
  segs(dpTheme,OPT.theme(), S.theme,v=>pick('theme',v,renderDisplay));
  segs(dpFs,   OPT.fs(),    S.fs,   v=>pick('fs',v,renderDisplay));
  segs(dpBar,  OPT.bar(),   S.bar,  v=>pick('bar',v,renderDisplay));
  /* バー太さのプレビュー（止める＝満タン、左＝吸う途中、右＝未使用） */
  barPrev.innerHTML=
    '<div class="tube h act"><div class="fill" style="position:absolute;inset:3px;border-radius:4px;background:var(--c-hold)"></div></div>'+
    '<div class="tube v l act"><div class="fill" style="position:absolute;left:3px;right:3px;top:3px;height:55%;border-radius:4px;background:var(--c-in)"></div></div>'+
    '<div class="tube v r fut"></div>';
}

/* ---------- 初回オンボーディング（1:表示 → 2:通知） ---------- */
let obStep=1;
function renderOnboard(){
  obTtl.textContent = obStep===1 ? t('ob.title')  : t('ob.title2');
  obSub.textContent = obStep===1 ? t('ob.sub')    : t('ob.sub2');
  obNext.textContent= obStep===1 ? t('ob.next')   : t('ob.start');
  obStep1.style.display = obStep===1 ? '' : 'none';
  obStep2.style.display = obStep===2 ? '' : 'none';
  obBack.style.display  = obStep===2 ? '' : 'none';
  sd1.className='sdot'+(obStep===1?' on':'');
  sd2.className='sdot'+(obStep===2?' on':'');

  if(obStep===1){
    segs(obLang, OPT.lang(),  S.lang, v=>pick('lang',v,renderOnboard));
    segs(obTheme,OPT.theme(), S.theme,v=>pick('theme',v,renderOnboard));
    segs(obFs,   OPT.fs(),    S.fs,   v=>pick('fs',v,renderOnboard));
    segs(obBar,  OPT.bar(),   S.bar,  v=>pick('bar',v,renderOnboard));
  }else{
    renderToggles();
  }
}
obNext.onclick=()=>{
  if(obStep===1){ obStep=2; renderOnboard(); return; }
  S.onboarded=true; save(); go('home');
};
obBack.onclick=()=>{ obStep=1; renderOnboard(); };

/* =========================================================
   ホーム
   ========================================================= */
function renderHome(){
  const p=presetById(S.presetId), r=roundsFor(S.presetId);
  hNm.textContent=label(p.id);
  hRatio.innerHTML=ratioHTML(p);
  hMeta.textContent=metaLine(p,r);
  hStreak.innerHTML = S.streak.count>0 ? FLAME+esc(streakText(S.streak.count)) : esc(t('home.nostreak'));
  renderPrepPicker();
}

/* =========================================================
   準備時間ピッカー（仕様書 §3）
   選択ピルは中央に固定し、値のほうが流れる。
   ========================================================= */
const PICK_W=62;
function prepLabelOf(v){ return v===0 ? t('prep.none') : v+'s'; }
function renderPrepPicker(){
  const spacer='<div style="flex:none;width:calc(50% - '+(PICK_W/2)+'px)"></div>';
  prepScroll.innerHTML = spacer +
    PREPS.map(v=>'<div class="pick-item" data-v="'+v+'">'+esc(prepLabelOf(v))+'</div>').join('') + spacer;
  markPrep();
  /* レイアウト確定後に現在値まで送る（初期描画では幅が未確定なため） */
  requestAnimationFrame(()=>{
    const i=Math.max(0,PREPS.indexOf(S.prepSeconds));
    prepScroll.scrollLeft=i*PICK_W;
    markPrep();
  });
  updatePrepWarn();
}
function markPrep(){
  [...prepScroll.querySelectorAll('.pick-item')].forEach(n=>{
    n.classList.toggle('on', Number(n.dataset.v)===S.prepSeconds);
  });
}
prepScroll.addEventListener('scroll',()=>{
  const i=Math.round(prepScroll.scrollLeft/PICK_W);
  const v=PREPS[Math.max(0,Math.min(PREPS.length-1,i))];
  if(v!==S.prepSeconds){
    S.prepSeconds=v; save(); markPrep(); updatePrepWarn();
    vibe(5);                     /* 1目盛りごとの軽いハプティクス */
  }
});
/* タップでもその値に送れるようにする（スクロールだけだと細かい調整がしづらい） */
prepScroll.addEventListener('click',e=>{
  const it=e.target.closest('[data-v]'); if(!it) return;
  const i=PREPS.indexOf(Number(it.dataset.v));
  if(i>=0) prepScroll.scrollTo({left:i*PICK_W,behavior:'smooth'});
});

/* 仕様書 §12.1：音もバイブもOFFだと準備時間の終了に気づけず機能が無意味になる。
   設定画面まで行かないと気づけない作りにしないため、その場で警告を出す。 */
function updatePrepWarn(){
  const silent = !S.settings.sound && !S.settings.vibe;
  const show = silent && S.prepSeconds>3;
  prepWarn.className='pick-note'+(show?' on':'');
  prepWarn.innerHTML = show
    ? esc(t('prep.warn'))+' <u data-go="notif">'+esc(t('prep.warnLink'))+'</u>'
    : '';
}

/* =========================================================
   準備シーケンス（仕様書 §7）
   ========================================================= */
function prepSteps(){
  const a=[];
  if(S.prepSeconds>0) a.push({k:'posture',dur:S.prepSeconds,lab:'prep.posture'});
  a.push({k:'in', dur:PREP_IN, lab:'prep.in', vo:'prep.voIn'});
  a.push({k:'ex', dur:PREP_EX, lab:'prep.ex', vo:'prep.voEx'});
  /* 「間」では読み上げない。直後の本編①が「左から吸って」と言うため重複する */
  a.push({k:'gap',dur:PREP_GAP,lab:'prep.gap'});
  return a;
}
const prun={active:false,steps:null,idx:0,t0:0,raf:0};
const pel={top:document.getElementById('pTop'),left:document.getElementById('pLeft'),right:document.getElementById('pRight')};

function startPrep(){
  bowlStop();   /* 完了画面から続けて始めた場合、前回の余韻を断つ */
  preloadVoice();
  prun.steps=prepSteps(); prun.idx=0; prun.active=true;
  audio(); wakeOn();
  go('prep');
  prepEnter();
  prun.t0=performance.now();
  prepLoop();
}
function stopPrep(){ prun.active=false; cancelAnimationFrame(prun.raf); breathStop(); stopVoice(); }

function prepEnter(){
  const st=prun.steps[prun.idx];
  prepLabel.textContent=t(st.lab);
  prepLabel.style.color = st.k==='in' ? 'var(--c-in)' : (st.k==='ex' ? 'var(--c-ex)' : 'var(--muted)');
  /* 「間」では鳴らさない。呼吸フェーズではなく整えるための拍であり、
     ここで鳴らすと1秒後のセッション開始の鐘と二重に聞こえる。 */
  if(S.settings.sound && st.k!=='gap') bell(st.k==='ex'?BELL_EX:BELL_IN,2.6,.16);
  if(st.k!=='gap') vibe(30);
  if(st.vo) speak(st.vo);
  /* 準備の導入呼吸にも呼吸音を乗せる */
  if(st.k==='in')      breathPlay('inhale',st.dur);
  else if(st.k==='ex') breathPlay('exhale',st.dur);
  else                 breathStop();
  /* 目盛りは吸う3分割・吐く6分割。段が変わる時だけ作り直す */
  [pel.left,pel.right].forEach(n=>{
    clearTicks(n);
    if(st.k==='in'||st.k==='ex') buildTicks(n,n.querySelector('.fill'),'v',{dur:st.dur});
  });
  prepPaint(st,0);
}

function prepPaint(st,p){
  const fl=pel.left.querySelector('.fill'), fr=pel.right.querySelector('.fill'), ft=pel.top.querySelector('.fill');
  pel.left.className='tube v l'; pel.right.className='tube v r'; pel.top.className='tube h';
  prepNum.style.display='none';

  if(st.k==='posture'){
    /* 満タン＋薄く＝「充填済み、まだ動かない」 */
    pel.left.className+=' act'; pel.right.className+=' act'; pel.top.className+=' fut';
    const s='position:absolute;inset:3px;border-radius:5px;opacity:.38;background:var(--c-in)';
    fl.style.cssText=s; fr.style.cssText=s; ft.style.cssText='display:none';
    prepNum.style.display='';
    prepNum.textContent=Math.max(1,Math.ceil(st.dur-p*st.dur));
    return;
  }
  if(st.k==='gap'){
    /* 本編①の開始状態（左のみ満タン）に整え、「次は左」の予告も兼ねる */
    pel.left.className+=' act'; pel.right.className+=' fut'; pel.top.className+=' fut';
    fl.style.cssText='position:absolute;inset:3px;border-radius:5px;background:var(--c-in)';
    fr.style.cssText='display:none'; ft.style.cssText='display:none';
    return;
  }

  const col = st.k==='in' ? 'var(--c-in)' : 'var(--c-ex)';
  const h   = st.k==='in' ? (1-p) : p;          /* 縦バー：吸う＝減る / 吐く＝増える */
  pel.left.className+=' act'; pel.right.className+=' act'; pel.top.className+=' act';
  const vs='position:absolute;left:3px;right:3px;top:3px;border-radius:5px;overflow:hidden;background:'+col+
           ';height:calc((100% - 6px) * '+h+')';
  fl.style.cssText=vs; fr.style.cssText=vs;

  /* 上辺：下端を固定し、吸う＝下から満ちる／吐く＝上から減る。
     縦バーが減って上辺が満ちる＝息が腕を上って頭頂に溜まる、
     上辺が減って縦バーが満ちる＝そこから戻っていく、という流れになる。 */
  const tv = st.k==='in' ? p : (1-p);
  ft.style.cssText='position:absolute;left:3px;right:3px;bottom:3px;border-radius:5px;background:'+col+
                   ';height:calc((100% - 6px) * '+tv+')';
}

function prepLoop(){
  if(!prun.active) return;
  const st=prun.steps[prun.idx];
  const e=(performance.now()-prun.t0)/1000;
  const p=st.dur>0 ? Math.min(1,e/st.dur) : 1;
  prepPaint(st,p);
  if(e>=st.dur){
    prun.idx++;
    if(prun.idx>=prun.steps.length){ stopPrep(); startSession(); return; }
    prun.t0=performance.now();
    prepEnter();
  }
  prun.raf=requestAnimationFrame(prepLoop);
}

/* =========================================================
   システムの更新（設定ハブ）
   Service Worker はキャッシュを持つため、放っておくと新版は
   「次に2回起動したとき」までしか反映されない。ここから即座に
   取り直せるようにする。
   ========================================================= */
let updBusy=false;
function renderUpdateRow(){
  updVer.textContent=t('upd.ver')+' '+APP_VERSION;
  if(!updBusy){ updSt.textContent=''; updSt.className='upd-st'; }
}
function updMsg(key,go){
  updSt.textContent=t(key);
  updSt.className='upd-st'+(go?' go':'');
}
async function doUpdate(){
  if(updBusy) return;
  updBusy=true;
  updMsg('upd.checking');
  try{
    if(navigator.onLine===false){ updMsg('upd.offline'); return; }

    /* サーバー上の index.html を必ずネットワークから取り、版番号を読む */
    const res=await fetch('index.html?cb='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('http '+res.status);
    const m=(await res.text()).match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(!m) throw new Error('version not found');

    if(m[1]===APP_VERSION){ updMsg('upd.latest'); return; }

    /* 新版がある：SWを更新し、キャッシュを捨ててから読み直す */
    updMsg('upd.found',true);
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){ try{ await reg.update(); }catch(e){} }
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    location.reload();
  }catch(e){
    updMsg('upd.failed');
  }finally{
    /* 再読み込みが走る場合はここに来ないので、戻った時だけ解除する */
    updBusy=false;
    setTimeout(()=>{ if(!updBusy) renderUpdateRow(); },3200);
  }
}
document.getElementById('btnUpdate').onclick=doUpdate;

/* =========================================================
   音・振動・読み上げ
   ========================================================= */
/* 鐘の基音。吸う＝明るく、止める＝控えめ、吐く＝最も低く収まる。
   C5 / G4 / F4 で互いに協和するので、連続して鳴っても濁らない。 */
const BELL_IN=523.25, BELL_HOLD=392.00, BELL_EX=349.23;
/* 終了のシンギングボウル。C4＝吸うチャイム C5 のオクターブ下 */
const BOWL_FREQ=261.63;

let actx=null, noiseBuf=null;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function resume(){ const a=audio(); if(a&&a.state==='suspended') a.resume(); return a; }

/* ---- 倒鐘（シンギングボウル）の合成 ----
   鐘の音が鐘らしいのは、倍音が整数倍ではなく非整数比で並ぶため。
   サイン波1本では出ないので、ハム/プライム/三度/五度…を重ね、
   高い部分音ほど速く減衰させる。撞木の当たる瞬間の音も短い
   ノイズで足している。 */
const BELL_PARTIALS=[
  {r:0.50, g:0.32, d:1.00},
  {r:1.00, g:1.00, d:0.92},
  {r:1.19, g:0.52, d:0.52},   /* 三度。鐘特有の陰りを出す */
  {r:1.50, g:0.32, d:0.38},
  {r:2.00, g:0.26, d:0.28},
  {r:2.66, g:0.13, d:0.18},
  {r:3.54, g:0.07, d:0.12},
];
function bell(freq,dur,gain){
  const a=resume(); if(!a) return;
  const t0=a.currentTime;
  const out=a.createGain(); out.gain.value=gain;
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=freq*6; lp.Q.value=.4;
  lp.connect(out); out.connect(a.destination);

  BELL_PARTIALS.forEach((p,i)=>{
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine';
    o.frequency.value=freq*p.r;
    o.detune.value=(i%2?1:-1)*(1.5+i*1.1);   /* わずかな揺らぎでうなりを作る */
    const pd=Math.max(.08,dur*p.d);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(p.g,t0+.006);
    g.gain.exponentialRampToValueAtTime(.0001,t0+pd);
    o.connect(g); g.connect(lp);
    o.start(t0); o.stop(t0+pd+.05);
  });

  /* 撞木が当たる瞬間 */
  try{
    const len=Math.floor(a.sampleRate*.035);
    const buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);
    const n=a.createBufferSource(); n.buffer=buf;
    const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq*2.4; bp.Q.value=1.1;
    const ng=a.createGain(); ng.gain.value=gain*.22;
    n.connect(bp); bp.connect(ng); ng.connect(a.destination);
    n.start(t0);
  }catch(e){}
}
/* ---- シンギングボウル（セッション終了音） ----
   ボウルの「ボーン」は、部分音が整数倍から大きく外れること
   （実測でおよそ 1 : 2.76 : 5.18 : 8.42）と、各モードがわずかに
   ずれて唸り（ビート）を作ることから生まれる。そのため部分音ごとに
   2本の発振器を数Hzずらして重ね、ゆっくりしたうねりを出している。
   基音は C4。吸うチャイム C5 のオクターブ下にあたり、締めくくりとして
   解決して聞こえる。これより低いと携帯のスピーカーでは再生されない。 */
const BOWL_PARTIALS=[
  {r:1.00,  g:1.00, d:13.0, beat:0.7},
  {r:2.76,  g:0.40, d:8.0,  beat:1.1},
  {r:5.18,  g:0.19, d:4.5,  beat:1.6},
  {r:8.42,  g:0.09, d:2.6,  beat:2.1},
  {r:12.40, g:0.04, d:1.5,  beat:2.6},
];
let bowlNodes=null;
function bowlStop(){
  if(!bowlNodes) return;
  bowlNodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
  bowlNodes=null;
}
function singingBowl(freq,gain){
  const a=resume(); if(!a) return;
  bowlStop();
  const t0=a.currentTime;
  const out=a.createGain(); out.gain.value=gain;
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=freq*13; lp.Q.value=.3;
  lp.connect(out); out.connect(a.destination);

  const nodes=[];
  BOWL_PARTIALS.forEach(p=>{
    [-1,1].forEach(side=>{      /* 2本をずらして重ね、唸りを作る */
      const o=a.createOscillator(), g=a.createGain();
      o.type='sine';
      o.frequency.value=freq*p.r + side*p.beat/2;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(p.g*.5,t0+.03);   /* 布巻きの撞木なので立ち上がりは瞬間的にしない */
      g.gain.exponentialRampToValueAtTime(.0001,t0+p.d);
      o.connect(g); g.connect(lp);
      o.start(t0); o.stop(t0+p.d+.1);
      nodes.push(o);
    });
  });

  /* 撞木が当たる瞬間。金属的にならないよう高域を落とした短いノイズ */
  try{
    const len=Math.floor(a.sampleRate*.09);
    const buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    const n=a.createBufferSource(); n.buffer=buf;
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq*3.2; f.Q.value=.7;
    const ng=a.createGain(); ng.gain.value=gain*.3;
    n.connect(f); f.connect(ng); ng.connect(a.destination);
    n.start(t0); nodes.push(n);
  }catch(e){}

  bowlNodes=nodes;
}

/* 秒ごとのティック。鐘と混ざらないよう、ごく短い柔らかい点にする */
function tickSound(){
  const a=resume(); if(!a) return;
  const t0=a.currentTime;
  const o=a.createOscillator(), g=a.createGain(), lp=a.createBiquadFilter();
  o.type='sine'; o.frequency.value=1320;
  lp.type='lowpass'; lp.frequency.value=2600;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(.022,t0+.004);
  g.gain.exponentialRampToValueAtTime(.0001,t0+.055);
  o.connect(lp); lp.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+.08);
}

/* ---- 呼吸音 ----
   息そのものに近い帯域ノイズ。吸うときは中心周波数が上がりながら膨らみ、
   吐くときは下がりながら減衰する。音階を持たないので鐘と喧嘩しない。 */
let breath=null;
function breathStop(){
  if(!breath) return;
  try{ breath.src.stop(); }catch(e){}
  breath=null;
}
function breathPlay(kind,dur){
  breathStop();
  if(!S.settings.breath) return;
  const a=resume(); if(!a||dur<=0) return;
  if(!noiseBuf){
    const len=Math.floor(a.sampleRate*2);
    noiseBuf=a.createBuffer(1,len,a.sampleRate);
    const ch=noiseBuf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+w*.03)/1.03; ch[i]=last*3.2; }
  }
  const t0=a.currentTime, t1=t0+dur;
  const src=a.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.85;
  const g=a.createGain();
  const peak=.055;

  if(kind==='inhale'){
    bp.frequency.setValueAtTime(320,t0);
    bp.frequency.linearRampToValueAtTime(950,t1);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.linearRampToValueAtTime(peak,t0+dur*.65);
    g.gain.linearRampToValueAtTime(.0001,t1);
  }else{
    bp.frequency.setValueAtTime(900,t0);
    bp.frequency.linearRampToValueAtTime(260,t1);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.linearRampToValueAtTime(peak,t0+dur*.22);
    g.gain.linearRampToValueAtTime(.0001,t1);
  }
  src.connect(bp); bp.connect(g); g.connect(a.destination);
  src.start(t0); src.stop(t1+.05);
  breath={src:src};
}
function vibe(ms){ if(S.settings.vibe&&navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} }
/* ---- 音声ガイド ----
   録音ファイルがあればそれを再生し、無ければ端末の読み上げに落とす。
   ファイルは audio/<lang>/<name>.mp3 に置く（README 参照）。
   一度 404 を踏んだ組み合わせは覚えておき、毎回取りに行かない。 */
/* 声の種類。audio/<種類>/<言語>/<名前>.mp3 に対応する */
const VOICE_KINDS=['warm','space','male'];
const VOICE_FILE={
  'vo.inL':'inhale-left', 'vo.inR':'inhale-right', 'vo.hold':'hold',
  'vo.exL':'exhale-left', 'vo.exR':'exhale-right',
  'prep.voIn':'prep-inhale', 'prep.voEx':'prep-exhale',
};
const voiceMissing={}, voiceEl={};
let curVoice=null;

function voiceNode(id){
  let el=voiceEl[id];
  if(!el){
    el=new Audio('audio/'+id+'.mp3');
    el.preload='auto';
    /* ファイル自体が読めない環境でだけ、以後このキーを読み上げに回す */
    el.addEventListener('error',()=>{ voiceMissing[id]=true; });
    voiceEl[id]=el;
  }
  return el;
}
function speak(key){
  if(!S.settings.voice) return;
  stopVoice();
  const name=VOICE_FILE[key];
  if(!name){ speakTTS(t(key)); return; }
  const id=S.voiceKind+'/'+S.lang+'/'+name;
  if(voiceMissing[id]){ speakTTS(t(key)); return; }

  const el=voiceNode(id);
  curVoice=el;
  try{ el.currentTime=0; }catch(e){}
  const p=el.play();
  if(p&&p.catch) p.catch(()=>{
    /* 再生が弾かれただけなら今回だけ読み上げに回す。
       ここで恒久的に無効化すると、一度の失敗でそのクリップが
       セッション中ずっと鳴らなくなってしまう。 */
    if(curVoice===el) speakTTS(t(key));
  });
}
/* セッション開始（利用者の操作直後）に全クリップを先読みする。
   初回再生時の読み込み待ちをなくし、取りこぼしを防ぐ。 */
function preloadVoice(){
  if(!S.settings.voice) return;
  Object.keys(VOICE_FILE).forEach(k=>{
    const id=S.voiceKind+'/'+S.lang+'/'+VOICE_FILE[k];
    if(!voiceMissing[id]){ try{ voiceNode(id).load(); }catch(e){} }
  });
}
function speakTTS(txt){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang = S.lang==='en' ? 'en-US' : 'ja-JP'; u.rate=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopVoice(){
  if(curVoice){ try{ curVoice.pause(); curVoice.currentTime=0; }catch(e){} curVoice=null; }
  if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(e){}
}

let wl=null;
async function wakeOn(){
  if(!S.settings.wake||!navigator.wakeLock) return;
  try{ wl=await navigator.wakeLock.request('screen'); }catch(e){}
}
function wakeOff(){ if(wl){ try{wl.release();}catch(e){} wl=null; } }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&run.active&&!run.paused) wakeOn();
});

/* =========================================================
   セッション
   ========================================================= */
const run={active:false,paused:false,p:null,ph:null,rounds:0,idx:0,round:0,t0:0,acc:0,tick:-1,raf:0};
const el={
  head:document.getElementById('sHead'), lab:document.getElementById('sLabel'),
  num:document.getElementById('sNum'), dur:document.getElementById('sDur'),
  dots:document.getElementById('sDots'),
  top:document.getElementById('bTop'), left:document.getElementById('bLeft'), right:document.getElementById('bRight'),
};

function startSession(){
  const p=presetById(S.presetId);
  run.p=p; run.ph=phasesOf(p); run.rounds=roundsFor(S.presetId);
  run.active=true; run.paused=false; run.idx=0; run.round=0; run.acc=0; run.tick=-1;
  audio(); wakeOn();
  buildDots();
  go('session');
  enterPhase(true);
  run.t0=performance.now();
  loop();
}
function enterPhase(first){
  const ph=run.ph[run.idx];
  el.lab.textContent=t(ph.lab);
  el.lab.style.color=CVAR[ph.col];
  el.dur.textContent='/ '+ph.dur+'s';
  el.head.textContent=t('sess.round')+' '+(run.round+1)+' / '+run.rounds;
  run.tick=-1;
  updDots();
  layout(0);
  if(S.settings.sound) bell(ph.k==='exhale'?BELL_EX:(ph.k==='hold'?BELL_HOLD:BELL_IN),2.6,.16);
  vibe(first?40:30);
  speak(ph.vo);
  /* 吸う・吐くに沿って息の音が動く。止めるときは鳴らさない */
  if(ph.k==='inhale')      breathPlay('inhale',ph.dur);
  else if(ph.k==='exhale') breathPlay('exhale',ph.dur);
  else                     breathStop();
}

function layout(tt){
  const ph=run.ph[run.idx], st=BARS[run.idx];
  /* 止める=0秒のときは止めるフェーズ自体が存在しないので、
     上辺バーに「完了」の色を残さず常に未使用として描く */
  const top = (run.p.hold>0) ? st.top : ['fut'];
  paint(el.top,  top,     'h', ph, tt);
  paint(el.left, st.left, 'v', ph, tt);
  paint(el.right,st.right,'v', ph, tt);
}
function paint(node,state,axis,ph,tt){
  node.className='tube '+(axis==='h'?'h':'v '+(node===el.left?'l':'r'))+
                 (state[0]==='fut'?' fut':(state[0]==='act'?' act':''));
  const fill=node.querySelector('.fill');

  if(state[0]==='fut'){ fill.style.cssText='display:none'; clearTicks(node); return; }

  if(state[0]==='done'){
    fill.style.cssText='position:absolute;inset:3px;border-radius:4px;z-index:1;opacity:.2;background:'+CVAR[state[1]];
    clearTicks(node);
    return;
  }

  const col=CVAR[ph.col];
  let pct = (ph.k==='exhale') ? tt*100 : (1-tt)*100;
  pct=Math.max(0,Math.min(100,pct));

  if(axis==='v'){
    fill.style.cssText='position:absolute;left:3px;right:3px;top:3px;border-radius:4px;z-index:1;overflow:hidden;background:'+col+
                       ';height:calc((100% - 6px) * '+(pct/100)+')';
  }else{
    fill.style.cssText='position:absolute;top:3px;bottom:3px;'+(ph.dir==='ltr'?'right':'left')+
                       ':3px;border-radius:4px;z-index:1;overflow:hidden;background:'+col+
                       ';width:calc((100% - 6px) * '+(pct/100)+')';
  }

  /* バー太さを変えると実寸が変わるので key に寸法も含める */
  const key=ph.k+'|'+ph.dur+'|'+(ph.dir||'')+'|'+axis+'|'+node.clientWidth+'x'+node.clientHeight;
  if(node.dataset.tkKey!==key){
    if(buildTicks(node,fill,axis,ph)) node.dataset.tkKey=key;
  }
}
function clearTicks(node){
  node.querySelectorAll('.tk').forEach(n=>n.remove());
  delete node.dataset.tkKey;
}
/* 目盛りは2層。下層(明るい線)はチューブ直下に全長で置き空の部分でも見える。
   上層(トラック色の線)は .fill の内側に置き、overflow で塗りの範囲だけに切られる。
   両方を全長で置くと上層が下層を覆い隠して何も見えなくなる。 */
function buildTicks(node,fill,axis,ph){
  clearTicks(node);
  const n=ph.dur;
  const innerW=node.clientWidth-6, innerH=node.clientHeight-6;
  const span = axis==='v' ? innerH : innerW;
  if(span<=0) return false;
  if(n<2 || span/n < MIN_TICK_PX) return true;

  for(let i=1;i<n;i++){
    const d=span*i/n;
    const b=document.createElement('div');
    b.className='tk tk-bg';
    b.style.cssText = axis==='v'
      ? 'left:3px;right:3px;top:'+(3+d-1)+'px;height:2px;'
      : 'top:3px;bottom:3px;left:'+(3+d-1)+'px;width:2px;';
    node.appendChild(b);

    const f=document.createElement('div');
    f.className='tk tk-fg';
    if(axis==='v')          f.style.cssText='left:0;right:0;top:'+(d-1)+'px;height:2px;';
    else if(ph.dir==='ltr') f.style.cssText='top:0;bottom:0;right:'+(innerW-d-1)+'px;width:2px;';
    else                    f.style.cssText='top:0;bottom:0;left:'+(d-1)+'px;width:2px;';
    fill.appendChild(f);
  }
  return true;
}

/* 次のフェーズへ進む。0秒のフェーズ（カスタムで止める=0にした場合）は飛ばす。
   全セッション終了なら false を返す。guard は全フェーズが0秒という異常時の保険。 */
function nextPhase(){
  let guard=0;
  do{
    run.idx++;
    if(run.idx>=run.ph.length){
      run.idx=0; run.round++;
      if(run.round>=run.rounds) return false;
    }
  }while(run.ph[run.idx].dur<=0 && ++guard<run.ph.length);
  return run.ph[run.idx].dur>0;
}

/* 仕様書 §8.6：ラウンド数が13以上ならドット列をやめ、連続バー＋テキストに切り替える
   （13個以上は1個が細くなりすぎて現在位置を読み取れないため） */
function buildDots(){
  const n=run.rounds;
  if(n>=13){
    el.dots.innerHTML='<div class="rbar"><div class="rbar-fill" id="rbarFill"></div></div>'+
                      '<div class="rbar-tx" id="rbarTx"></div>';
    return;
  }
  const w=Math.max(6,Math.min(19,Math.floor((180-(n-1)*5)/n)));
  /* data-i は i18n 用セレクタなのでドットには付けない（翻訳処理に拾われて文字が入る） */
  el.dots.innerHTML=Array.from({length:n},()=>
    '<span class="dot" style="width:'+w+'px"></span>').join('');
}
function updDots(){
  if(run.rounds>=13){
    const f=document.getElementById('rbarFill'), x=document.getElementById('rbarTx');
    if(f) f.style.width=(run.round/run.rounds*100).toFixed(2)+'%';
    if(x) x.textContent=t('sess.round')+' '+(run.round+1)+' / '+run.rounds;
    return;
  }
  [...el.dots.children].forEach((d,i)=>{
    d.className='dot'+(i<run.round?' dn':(i===run.round?' cur':''));
  });
}

function loop(){
  if(!run.active||run.paused) return;
  const ph=run.ph[run.idx];
  const e=(run.acc+(performance.now()-run.t0))/1000;
  /* dur=0 だと e/dur が NaN になり毎フレーム次へ進んでセッションが一瞬で終わる。
     0秒フェーズは nextPhase() 側で読み飛ばすが、計算自体も安全側に倒す。 */
  const tt=ph.dur>0 ? Math.min(1,e/ph.dur) : 1;

  layout(tt);
  /* 仕様書 §8.6：残り秒を表示する（経過ではない）。
     1秒未満を切り上げるので dur→1 と数え下がり、0は出ない。 */
  el.num.textContent=Math.max(1,Math.ceil(ph.dur-e));

  const sec=Math.floor(e);
  if(S.settings.tick&&sec!==run.tick&&sec>0&&sec<ph.dur){ tickSound(); vibe(8); }
  if(sec!==run.tick) run.tick=sec;

  if(e>=ph.dur){
    if(!nextPhase()){ finish(); return; }
    run.acc=0; run.t0=performance.now();
    enterPhase(false);
  }
  run.raf=requestAnimationFrame(loop);
}

function pause(){
  if(!run.active||run.paused) return;
  run.paused=true;
  run.acc+=performance.now()-run.t0;
  cancelAnimationFrame(run.raf);
  wakeOff();
  breathStop(); stopVoice();
  const d=document.createElement('div');
  d.className='ovl'; d.id='pauseOvl';
  d.innerHTML='<h3>'+t('sess.paused')+'</h3><p>'+t('sess.round')+' '+(run.round+1)+' / '+run.rounds+'</p>'+
    '<div style="width:100%;margin-top:22px"><button class="btn p">'+t('sess.resume')+'</button>'+
    '<button class="btn s">'+t('sess.end')+'</button></div>';
  document.getElementById('session').appendChild(d);
  const b=d.querySelectorAll('.btn');
  b[0].onclick=ev=>{
    ev.stopPropagation(); d.remove(); run.paused=false; run.t0=performance.now(); wakeOn();
    /* 中断した分を除いた残り時間で呼吸音を鳴らし直す（最初から再生すると尺が合わない） */
    const ph=run.ph[run.idx], rest=ph.dur-run.acc/1000;
    if(rest>.3){
      if(ph.k==='inhale')      breathPlay('inhale',rest);
      else if(ph.k==='exhale') breathPlay('exhale',rest);
    }
    loop();
  };
  b[1].onclick=ev=>{ ev.stopPropagation(); d.remove(); stopSession(); go('home'); };
}
document.getElementById('session').addEventListener('click',e=>{
  if(e.target.closest('.ovl')) return;
  if(run.active&&!run.paused) pause();
});

function stopSession(){
  run.active=false; run.paused=false;
  cancelAnimationFrame(run.raf);
  wakeOff();
  const o=document.getElementById('pauseOvl'); if(o) o.remove();
  stopVoice(); breathStop();
}

function finish(){
  const p=run.p, total=roundSec(p)*run.rounds, rounds=run.rounds;
  stopSession();
  /* 終了はシンギングボウル1打。長く伸びる響きで区切りを作る */
  if(S.settings.sound) singingBowl(BOWL_FREQ,.22);
  vibe(90);   /* 撞木の一打に合わせ、単発の長めの振動 */
  const today=new Date(), ds=ymd(today);
  if(S.streak.last!==ds){
    const y=new Date(today); y.setDate(y.getDate()-1);
    S.streak.count=(S.streak.last===ymd(y))?S.streak.count+1:1;
    S.streak.last=ds;
  }
  S.history.push({preset:label(p.id),rounds:rounds,sec:total,date:ds,
    time:String(today.getHours()).padStart(2,'0')+':'+String(today.getMinutes()).padStart(2,'0')});
  if(S.history.length>200) S.history=S.history.slice(-200);
  save();
  dRounds.textContent=rounds+' / '+rounds;
  dTime.textContent=fmt(total);
  dPreset.textContent=label(p.id);
  dStreak.innerHTML=FLAME+streakText(S.streak.count);
  go('done');
}
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

document.getElementById('btnStart').onclick=startPrep;
document.getElementById('dAgain').onclick=startPrep;

/* =========================================================
   起動
   ========================================================= */
load();
/* 初回のみ端末の言語を初期値として推定する */
if(!S.onboarded && !localStorage.getItem('nadi')){
  S.lang = (navigator.language||'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en';
}
applyDisplay();
applyLang();
go(S.onboarded ? 'home' : 'onboard');

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
